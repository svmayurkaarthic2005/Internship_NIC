<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2951C4">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SIS AI Assistant - Tamil Nadu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    
    <!-- Google Fonts (optional - system fonts as fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <!-- Lucide Icons with offline fallback -->
    <script src="js/lucide-fallback.js?v=20260825_003"></script>
    <script src="https://unpkg.com/lucide@latest" onerror="console.log('Lucide CDN unavailable, using fallback')"></script>
    
    <!-- Stylesheets - Modular CSS -->
    <link rel="stylesheet" href="css/variables.css?v=20260920_001">
    <link rel="stylesheet" href="css/global.css?v=20260920_001">
    <link rel="stylesheet" href="css/animations.css?v=20260920_001">
    <link rel="stylesheet" href="css/components.css?v=20260920_001">
    <link rel="stylesheet" href="css/chatbot.css?v=20261003_001">
    <link rel="stylesheet" href="css/responsive.css?v=20261003_001">
    <link rel="stylesheet" href="css/table_styles.css?v=20261003_001">
    <link rel="stylesheet" href="css/attachments_panel.css?v=20261012_002">
</head>
<body class="chatbot-page">
    <div class="chat-main-container-new">
        <!-- Header -->
        <header class="chat-header-new">
            <div class="header-left-new">
                <div class="bot-avatar-container-new">
                    <i data-lucide="bot" class="bot-icon-new"></i>
                </div>
                <div class="header-title-group-new">
                    <h1 class="header-title-new">Sub Inspector Surveyor AI Assistant</h1>
                    <div class="status-indicator-new">
                        <span class="status-dot-new"></span>
                        <span class="status-text-new">Online</span>
                    </div>
                </div>
            </div>
            
            <!-- Keep hidden elements for JS compatibility -->
            <div style="display: none;">
                <span id="officerName"></span>
                <span id="employeeId"></span>
                <span id="officerCardName"></span>
                <span id="officerJurisdiction"></span>
                <span id="officerInitials"></span>
                <span id="officerAvatar"></span>
                <div id="quickSuggestions"></div>
            </div>

            <div class="header-right-new">
                <button class="icon-btn-new" id="attachmentsPanelBtn" aria-label="View attached files" title="View attached files">
                    <i data-lucide="paperclip" class="icon-new"></i>
                    <span>Files</span>
                    <span id="attachmentsPanelBadge" class="attachments-badge" hidden>0</span>
                </button>
                <button class="icon-btn-new" id="newChatBtn" aria-label="Start a new conversation" title="Start a new conversation">
                    <i data-lucide="plus" class="icon-new"></i>
                    <span>New Chat</span>
                </button>
                <button class="icon-btn-new logout-btn-new" id="logoutBtn" aria-label="Logout">
                    <i data-lucide="log-out" class="icon-new"></i>
                    <span>Logout</span>
                </button>
            </div>
        </header>
        
        <!-- Chat Area -->
        <main class="chat-main-new">
            <!-- Messages Container -->
            <div class="chat-messages-new" id="chatMessages" role="log" aria-live="polite" aria-atomic="false">
                <div class="date-separator-new">
                    <span>Today</span>
                </div>
                <!-- Messages will be appended here -->
            </div>
            
            <!-- Input Area -->
            <div class="chat-input-area-new">
                <div class="quick-chips" id="quickChips" role="group" aria-label="Suggested questions">
                    <button type="button" class="quick-chip" data-q="Show my pending applications">Pending applications</button>
                    <button type="button" class="quick-chip" data-q="Which applications are overdue?">Overdue</button>
                    <button type="button" class="quick-chip" data-q="What is my workload?">My workload</button>
                    <button type="button" class="quick-chip" data-q="Which application should I field visit next?">Next field visit</button>
                    <button type="button" class="quick-chip" data-q="What is service code 0154?">What is ISD?</button>
                </div>
                <div class="input-container-new">
                    <textarea 
                        id="messageInput" 
                        class="message-input-new" 
                        placeholder="Ask about applications..."
                        rows="1"
                        maxlength="1000"
                        aria-label="Message input"
                    ></textarea>
                    <div class="input-actions-new">
                        <button class="btn-send-new" id="sendBtn" disabled aria-label="Send message" title="Send message">
                            <i data-lucide="send" class="send-icon-new"></i>
                            <!-- Drawn in CSS rather than with an icon font: the stop
                                 square must never render alongside the send arrow,
                                 and it stays crisp if the icon library is slow. -->
                            <span class="stop-icon-new" aria-hidden="true"></span>
                        </button>
                        <button class="btn-icon-action-new" aria-label="Attach file" title="Attach file">
                            <i data-lucide="paperclip" class="attach-icon-new"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Attachments panel: server state is the only source of truth --
             rendered fresh from GET /sessions/{id}/attachments every time it
             opens, after an upload, after a delete and after a session
             change. Never built from localStorage. -->
        <aside class="attachments-panel" id="attachmentsPanel" hidden aria-label="Attached files">
            <div class="attachments-panel-header">
                <h2>Attached files</h2>
                <span class="attachments-panel-count" id="attachmentsPanelCount"></span>
                <button class="icon-btn-new" id="attachmentsPanelCloseBtn" aria-label="Close">
                    <i data-lucide="x" class="icon-new"></i>
                </button>
            </div>
            <div class="attachments-panel-body" id="attachmentsPanelBody">
                <p class="attachments-panel-empty">No files attached in this session yet.</p>
            </div>
        </aside>
        <div class="attachments-panel-backdrop" id="attachmentsPanelBackdrop" hidden></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- JavaScript -->
    <script src="js/chatStorage.js?v=20260909_001"></script>
    <script src="js/table_renderer.js?v=20261006_004"></script>
    <script src="js/chat.js?v=20261012_002"></script>
    <script>
        lucide.createIcons();

        // Starter chips: fill the box, send, and tuck the row away once a
        // conversation is under way.
        (function () {
            var chips = document.getElementById('quickChips');
            var input = document.getElementById('messageInput');
            var send = document.getElementById('sendBtn');
            var list = document.getElementById('chatMessages');
            if (!chips || !input || !send || !list) return;

            chips.addEventListener('click', function (e) {
                var chip = e.target.closest('.quick-chip');
                if (!chip) return;
                input.value = chip.getAttribute('data-q');
                input.dispatchEvent(new Event('input', { bubbles: true }));
                send.click();
            });

            function sync() {
                chips.hidden = list.querySelectorAll('.message-user').length > 0;
            }
            new MutationObserver(sync).observe(list, { childList: true });
            sync();
        })();
    </script>
</body>
</html>
